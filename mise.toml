[tools]
"aqua:dominikh/go-tools/staticcheck" = "2026.1"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"
go = "1.26.5"

[tasks.build]
run = 'go build -o cxg .'

[tasks.check]
run = [
  'test -z "$(gofmt -l .)"',
  'go fix -diff ./...',
  'go vet ./...',
  'staticcheck ./...',
  'govulncheck ./...',
]

[tasks.fmt]
run = 'gofmt -w .'

[tasks.test]
run = 'go test ./...'

[tasks.prerelease]
run = ['go mod tidy', 'git add go.mod go.sum']
