[tools]
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
go = "1.27.2"
golangci-lint = "2.15.0"

[tasks.build]
run = 'go build -o cxg ./cmd/cxg'

[tasks.check]
run = [
  'golangci-lint fmt --diff',
  'golangci-lint run',
  'go fix -diff ./...',
  'govulncheck ./...',
]

[tasks.fmt]
run = 'golangci-lint fmt'

[tasks.test]
run = 'go test ./...'

[tasks.prerelease]
run = ['go mod tidy', 'git add go.mod go.sum']
