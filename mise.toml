[tools]
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
go = "1.27.3"
golangci-lint = "2.15.0"
usage = { version = "7.1.0", workflow = "publish-cli.yml" }

[tasks.build]
run = 'go build -o cxg ./cmd/cxg'

[tasks.check]
run = [
  'golangci-lint fmt --diff',
  'golangci-lint run',
  'go fix -diff ./...',
  'govulncheck ./...',
]

[tasks.fmt]
run = 'golangci-lint fmt'

[tasks.test]
run = 'go test ./...'

[tasks.prerelease]
run = [
  'go mod tidy',
  'go run -ldflags=-X=main.version=$TAGPR_NEXT_VERSION ./cmd/cxg --usage-spec | usage generate markdown -f - > docs/usage.md',
  'git add go.mod go.sum docs/usage.md',
]
